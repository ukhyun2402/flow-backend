[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowstudio"
version = "0.2.0"
description = "Draw.io based backend process builder"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5", "sqlglot>=26,<40", "httpx>=0.28,<1",
  "defusedxml>=0.7.1,<1", "pymysql>=1.1,<2", "oracledb>=3,<5", "pyodbc>=5,<6"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.17,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
flowstudio = ["flow.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
